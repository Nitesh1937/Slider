<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
    <title>Image Slider</title>
</head>
<body>
    <div class="slider">
        <div class="slider-track">
            <div class="slide"><img src="images/img1.jpg" alt="slide1"></div>
            <div class="slide"><img src="images/img2.jpg" alt="slide2"></div>
            <div class="slide"><img src="images/img3.jpg" alt="slide3"></div>
            <div class="slide"><img src="images/img4.jpg" alt="slide4"></div>
            <div class="slide"><img src="images/img5.jpg" alt="slide5"></div>
        </div>
        <button class="slide-btn prev">&#10094;</button>
        <button class="slide-btn next">&#10095;</button>
        <div class="dots"></div>
    </div>
</body>
</html>
